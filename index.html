<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Command Deck</title>
<meta name="description" content="A quiet ops room for your work — capture, board, signal, pulse.">
<meta name="theme-color" content="#14120E">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* -- Ops Room tokens -- */
    --ink:#14120E;
    --panel:#1E1A14;
    --panel-2:#262019;
    --line: rgba(255,255,255,0.07);
    --text: #F2ECDF;
    --text-dim: #96907F;
    --accent: #E3A63C;
    --accent-ink: #1A1200;
    --danger: #C97E68;
    --lane-today: #E3A63C;
    --lane-week: #6FA0AC;
    --lane-someday: #756F60;
    --lane-done: #8A7F9C;

    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 28px; --sp-7: 40px;
    --fs-xs: 12px; --fs-sm: 13px; --fs-base: 15px; --fs-md: 17px; --fs-lg: 20px; --fs-xl: 26px; --fs-2xl: 34px;

    --ease: cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--text); font-family:'IBM Plex Sans', sans-serif; height:100%; overscroll-behavior-y: none;}
  .display{font-family:'Space Grotesk', sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:1100px; margin:0 auto; position:relative;}

  /* HEADER */
  header{
    padding: var(--sp-4) var(--sp-5) var(--sp-3);
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header .brand{display:flex; align-items:center; gap:var(--sp-2);}
  header .brand svg{width:22px; height:22px; color:var(--accent); flex-shrink:0;}
  header h1{font-size:var(--fs-md); font-weight:600; margin:0; letter-spacing:0.2px;}
  header .status{display:flex; align-items:center; gap:var(--sp-2);}
  header .clock{font-size:var(--fs-xs); color:var(--text-dim);}
  .blip{position:relative; width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .blip::after{
    content:''; position:absolute; inset:-6px; border-radius:50%; border:1px solid var(--accent);
    opacity:0; animation: sweep-ping 3s ease-out infinite;
  }
  @keyframes sweep-ping{
    0%{ transform:scale(0.4); opacity:0.55; }
    75%{ transform:scale(1.9); opacity:0; }
    100%{ transform:scale(1.9); opacity:0; }
  }

  /* NOW STRIP */
  .now-strip{
    display:flex; align-items:center; gap:var(--sp-2);
    padding: var(--sp-2) var(--sp-5);
    border-bottom:1px solid var(--line);
    font-size:var(--fs-sm); cursor:pointer; flex-shrink:0;
  }
  .now-strip svg{width:16px; height:16px; flex-shrink:0;}
  .now-strip .lbl{text-transform:uppercase; font-size:var(--fs-xs); letter-spacing:0.6px; opacity:0.75;}
  .now-strip.idle{color:var(--text-dim);}
  .now-strip:not(.idle){color:var(--accent); font-weight:600;}
  .now-strip .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .now-strip .mini-btn{margin-left:auto; flex-shrink:0;}

  /* MAIN */
  main{flex:1; overflow-y:auto; padding: var(--sp-5) var(--sp-4) 96px; -webkit-overflow-scrolling:touch;}
  .view{display:none; animation: fadeIn 260ms var(--ease);}
  .view.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  .section-title{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:1.2px; color:var(--text-dim); margin: 0 0 var(--sp-3) 2px; font-weight:500;}

  /* CAPTURE */
  .capture-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:var(--sp-4); margin-bottom:var(--sp-6);
  }
  textarea{
    width:100%; background:transparent; border:none; color:var(--text);
    font-family:'IBM Plex Sans', sans-serif; font-size:var(--fs-md); resize:none; outline:none;
    min-height:52px; line-height:1.5;
  }
  textarea::placeholder{color:var(--text-dim);}
  .field-error{outline:2px solid var(--danger); outline-offset:2px;}
  .capture-actions{display:flex; justify-content:flex-end; margin-top:var(--sp-2);}
  .btn{
    border:none; border-radius:var(--radius-sm); padding:12px 20px; font-size:var(--fs-sm); font-weight:600;
    cursor:pointer; transition: transform 150ms var(--ease), opacity 150ms;
    font-family:'IBM Plex Sans', sans-serif; min-height:44px;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}

  .queue-item{
    display:flex; align-items:flex-start; gap:var(--sp-3);
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:var(--sp-4); margin-bottom:var(--sp-2);
  }
  .queue-item .txt{flex:1; font-size:var(--fs-base); line-height:1.5;}
  .queue-item .meta{font-size:var(--fs-xs); color:var(--text-dim); margin-top:var(--sp-1);}
  .chip-row{display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3);}
  .chip{
    font-size:var(--fs-xs); padding:9px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; font-weight:500;
    transition: all 150ms var(--ease); min-height:32px; display:inline-flex; align-items:center;
  }
  .chip:active{transform:scale(0.94);}
  .chip.today{border-color:var(--lane-today); color:var(--lane-today);}
  .chip.week{border-color:var(--lane-week); color:var(--lane-week);}
  .chip.someday{border-color:var(--lane-someday); color:var(--lane-someday);}
  .empty{color:var(--text-dim); font-size:var(--fs-sm); padding:var(--sp-6) var(--sp-2); text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--sp-2);}
  .empty svg{width:28px; height:28px; opacity:0.35;}
  .item-actions{display:flex; justify-content:flex-end; margin-top:var(--sp-2);}

  /* BOARD */
  .lane-pills{display:none; gap:var(--sp-2); flex-wrap:wrap; margin-bottom:var(--sp-4);}
  @media(max-width:1023.98px){ .lane-pills{display:flex;} }
  .lane-pill{
    font-size:var(--fs-xs); padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; font-weight:500;
    min-height:32px; transition:all 150ms var(--ease);
  }
  .lane-pill.today{--lane-color:var(--lane-today);}
  .lane-pill.week{--lane-color:var(--lane-week);}
  .lane-pill.someday{--lane-color:var(--lane-someday);}
  .lane-pill.done{--lane-color:var(--lane-done);}
  .lane-pill.active{border-color:var(--lane-color); color:var(--lane-color); background:var(--panel);}
  .board-scroller{display:flex; gap:var(--sp-3); flex-wrap:wrap;}
  .column{
    width:100%; flex-shrink:0; display:none;
    background:var(--panel); border-radius:var(--radius-lg); border:1px solid var(--line);
    padding:var(--sp-4); max-height: calc(100vh - 320px); flex-direction:column;
  }
  .column.lane-active{display:flex;}
  @media(min-width:1024px){ .column{display:flex; width:23%; max-height: calc(100vh - 260px);} }
  .col-head{display:flex; align-items:center; gap:var(--sp-2); margin-bottom:var(--sp-3);}
  .col-bar{width:4px; height:16px; border-radius:2px;}
  .col-bar.today{background:var(--lane-today);} .col-bar.week{background:var(--lane-week);}
  .col-bar.someday{background:var(--lane-someday);} .col-bar.done{background:var(--lane-done);}
  .col-title{font-weight:600; font-size:var(--fs-base);}
  .col-count{margin-left:auto; font-size:var(--fs-xs); color:var(--text-dim);}
  .col-body{overflow-y:auto; flex:1;}
  .task-card{
    background:var(--panel-2); border-radius:10px; padding:var(--sp-3); margin-bottom:var(--sp-2);
    font-size:var(--fs-sm); line-height:1.45; border-left:3px solid transparent; word-break:break-word;
  }
  .task-card.today{border-left-color:var(--lane-today);}
  .task-card.week{border-left-color:var(--lane-week);}
  .task-card.someday{border-left-color:var(--lane-someday);}
  .task-card.done{border-left-color:var(--lane-done);}
  .card-age{font-size:var(--fs-xs); color:var(--text-dim); margin-top:var(--sp-1);}
  .task-card .row-actions{display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-2);}
  .mini-btn{font-size:var(--fs-xs); padding:6px 10px; border-radius:8px; background:transparent; border:1px solid var(--line); color:var(--text-dim); cursor:pointer; min-height:30px;}
  .mini-btn.danger{color:var(--danger); border-color:var(--danger);}
  .mini-btn.active{color:var(--accent); border-color:var(--accent);}
  .flag-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle;}

  /* SIGNAL */
  .insight-form{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--sp-4); margin-bottom:var(--sp-5);}
  select, input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:var(--fs-base); font-family:'IBM Plex Sans'; margin-bottom:var(--sp-2); outline:none; min-height:44px;
  }
  .insight-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:var(--sp-4); margin-bottom:var(--sp-2);
  }
  .src-tag{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.6px; color:var(--lane-week); font-weight:600;}
  .insight-card p{margin:var(--sp-2) 0 var(--sp-1); font-size:var(--fs-base); line-height:1.55;}
  .insight-card .ref{font-size:var(--fs-xs); color:var(--text-dim);}

  /* PULSE */
  .review-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:var(--sp-4); margin-bottom:var(--sp-2);}
  .review-item .txt{font-size:var(--fs-base); line-height:1.5;}
  .review-item .meta{font-size:var(--fs-xs); color:var(--text-dim); margin:var(--sp-1) 0 var(--sp-2);}
  .review-actions{display:flex; gap:var(--sp-2); flex-wrap:wrap;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-3); margin-bottom:var(--sp-6);}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--sp-4); position:relative; overflow:hidden;}
  .stat-card svg.sweep{position:absolute; right:-10px; top:-10px; width:64px; height:64px; opacity:0.08; color:var(--accent); pointer-events:none;}
  .stat-num{font-family:'Space Grotesk'; font-size:var(--fs-2xl); font-weight:700; position:relative;}
  .stat-label{font-size:var(--fs-xs); color:var(--text-dim); margin-top:var(--sp-1); position:relative;}
  .weekly-log{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:var(--sp-4);}
  .weekly-log label{font-size:var(--fs-xs); color:var(--text-dim); display:block; margin:var(--sp-3) 0 var(--sp-1);}
  .weekly-log label:first-child{margin-top:0;}
  .log-entry{border-top:1px solid var(--line); padding-top:var(--sp-3); margin-top:var(--sp-4);}
  .log-entry .wk{font-size:var(--fs-xs); color:var(--text-dim); margin-bottom:var(--sp-1);}
  .log-entry .field{font-size:var(--fs-sm); margin-bottom:3px;}
  .log-entry .field b{color:var(--text-dim); font-weight:500;}

  /* NAV */
  nav{
    position:fixed; bottom:0; left:0; right:0; max-width:1100px; margin:0 auto;
    background: var(--panel);
    border-top:1px solid var(--line);
    display:flex; padding: var(--sp-2) var(--sp-2) calc(var(--sp-2) + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; color:var(--text-dim); padding:8px 4px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    font-family:'IBM Plex Sans'; font-size:var(--fs-xs); transition: color 150ms var(--ease); min-height:44px;
  }
  .nav-btn.active{color:var(--accent);}
  .nav-btn svg{width:20px; height:20px;}
  .nav-btn:active{transform:scale(0.94);}

  ::-webkit-scrollbar{display:none;}

  /* ATTACHMENTS */
  .attach-btn{padding:12px 16px;}
  .attach-btn svg{width:18px; height:18px; display:block;}
  .attach-badge{
    display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;
    background:none; border:none; color:inherit; font-family:inherit; font-size:inherit; padding:0;
  }
  .attach-badge svg{width:15px; height:15px; color:var(--accent); flex-shrink:0;}
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:50; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .overlay-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:var(--sp-4); width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
  }
  @media(min-width:768px){
    .overlay{align-items:center;}
    .overlay-panel{border-radius:var(--radius-lg);}
  }
  .attach-row{display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3);}
  .attach-thumb{width:56px; height:56px; object-fit:cover; border-radius:8px; background:var(--panel-2); flex-shrink:0;}
  .attach-file-icon{display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
  .attach-file-icon svg{width:24px; height:24px;}
  .attach-meta{flex:1; font-size:var(--fs-sm); min-width:0;}
  .attach-name{word-break:break-word;}
  .attach-error{color:var(--danger); font-size:var(--fs-xs); margin-top:2px;}
  .share-mark{width:12px; height:12px; color:var(--accent); opacity:0.6; margin-right:4px; vertical-align:-2px; flex-shrink:0;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-scope" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 12 L12 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.2" cy="8.6" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-capture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v6M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="4" y="9" width="4" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="4" width="4" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="16" y="12" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M8.5 17a6 6 0 0 1 0-10M15.5 7a6 6 0 0 1 0 10M5.5 19.5a10 10 0 0 1 0-15M18.5 4.5a10 10 0 0 1 0 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-6 3 12 2-8 2 4h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24"><path d="M16.5 6.5 9 14a3 3 0 1 0 4.24 4.24l7-7a5 5 0 1 0-7.07-7.07l-7 7a7 7 0 1 0 9.9 9.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<div id="app">
  <header>
    <div class="brand">
      <svg><use href="#i-scope"/></svg>
      <h1 class="display">Command Deck</h1>
    </div>
    <div class="status">
      <div class="clock mono" id="clock"></div>
      <div class="blip"></div>
    </div>
  </header>
  <div class="now-strip idle" id="nowStrip" onclick="switchView('board')"></div>

  <main>
    <!-- CAPTURE -->
    <section class="view active" id="view-capture">
      <div class="capture-box">
        <textarea id="captureInput" placeholder="What's on your mind? Just dump it here..." rows="2"></textarea>
        <input type="file" id="captureFileInput" accept="image/*,application/pdf" multiple style="display:none" onchange="onAttachFilesChosen(this.files)">
        <div class="capture-actions">
          <button type="button" class="btn btn-ghost attach-btn" onclick="document.getElementById('captureFileInput').click()" aria-label="Attach a file">
            <svg><use href="#i-attach"/></svg>
          </button>
          <button class="btn btn-primary" onclick="addCapture()">Log it</button>
        </div>
      </div>
      <div class="section-title">Untriaged</div>
      <div id="queueList"></div>
    </section>

    <!-- BOARD -->
    <section class="view" id="view-board">
      <div class="section-title">The Board</div>
      <div class="lane-pills" id="lanePills"></div>
      <div class="board-scroller" id="boardScroller"></div>
    </section>

    <!-- SIGNAL -->
    <section class="view" id="view-signal">
      <div class="insight-form">
        <select id="insightSource">
          <option>Customer Call</option>
          <option>Support Ticket</option>
          <option>Sales Feedback</option>
          <option>Internal Stakeholder</option>
          <option>Data/Analytics</option>
          <option>Other</option>
        </select>
        <textarea id="insightText" placeholder="What did you learn?" rows="2"></textarea>
        <input type="text" id="insightRef" placeholder="Link or reference (optional)">
        <div class="capture-actions">
          <button class="btn btn-primary" onclick="addInsight()">Log signal</button>
        </div>
      </div>
      <div class="section-title">Recent signals</div>
      <div id="insightList"></div>
    </section>

    <!-- PULSE -->
    <section class="view" id="view-pulse">
      <div class="section-title">This week</div>
      <div class="stat-grid" id="statGrid"></div>

      <div class="section-title">Someday review</div>
      <div id="somedayReview"></div>

      <div class="section-title">Weekly reality check</div>
      <div class="weekly-log">
        <label>What shipped</label>
        <input type="text" id="wkShipped" placeholder="e.g. Onboarding v2 went live">
        <label>What's stuck</label>
        <input type="text" id="wkStuck" placeholder="e.g. Waiting on legal review">
        <label>What surprised me</label>
        <input type="text" id="wkSurprise" placeholder="e.g. Pricing drove churn, not usability">
        <div class="capture-actions">
          <button class="btn btn-primary" onclick="addWeekly()">Save entry</button>
        </div>
        <div id="weeklyList"></div>
      </div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" data-view="capture" onclick="navTap('capture')">
      <svg><use href="#i-capture"/></svg>
      Capture
    </button>
    <button class="nav-btn" data-view="board" onclick="navTap('board')">
      <svg><use href="#i-board"/></svg>
      Board
    </button>
    <button class="nav-btn" data-view="signal" onclick="navTap('signal')">
      <svg><use href="#i-signal"/></svg>
      Signal
    </button>
    <button class="nav-btn" data-view="pulse" onclick="navTap('pulse')">
      <svg><use href="#i-pulse"/></svg>
      Pulse
    </button>
  </nav>

  <div class="overlay" id="attachOverlay">
    <div class="overlay-panel">
      <div class="section-title">Add context</div>
      <div id="attachOverlayList"></div>
      <div class="attach-error" id="attachSaveError" style="display:none"></div>
      <textarea id="attachNote" placeholder="Add a note (optional)" rows="2"></textarea>
      <div class="capture-actions">
        <button class="btn btn-ghost" onclick="closeAttachOverlay()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAttachCapture()">Save</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="viewOverlay">
    <div class="overlay-panel">
      <div class="section-title">Attachments</div>
      <div id="viewOverlayList"></div>
      <div class="capture-actions">
        <button class="btn btn-ghost" onclick="closeViewOverlay()">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
let state = { tasks: [], insights: [], weekly: [] };

const DB_NAME = 'command-deck';
const DB_VERSION = 2;
const STORE = 'kv';
const ATTACH_STORE = 'attachments';

let dbPromise = null;
function openDB(){
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      let settled = false;
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        if(!db.objectStoreNames.contains(ATTACH_STORE)) db.createObjectStore(ATTACH_STORE);
      };
      req.onsuccess = () => {
        const db = req.result;
        if(settled){ db.close(); return; }
        settled = true;
        db.onversionchange = () => { db.close(); dbPromise = null; };
        resolve(db);
      };
      req.onerror = () => { settled = true; reject(req.error); };
      req.onblocked = () => {
        console.error('IndexedDB upgrade blocked — another tab has this app open');
        setTimeout(() => {
          if(!settled){ settled = true; dbPromise = null; reject(new Error('IndexedDB upgrade blocked by another open tab')); }
        }, 5000);
      };
    });
  }
  return dbPromise;
}

async function idbGet(key, store = STORE){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value, store = STORE){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDelete(key, store = STORE){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAttachment(id){ return idbGet(id, ATTACH_STORE); }
async function idbPutAttachment(id, file){ return idbSet(id, file, ATTACH_STORE); }
async function idbDeleteAttachment(id){ return idbDelete(id, ATTACH_STORE); }

async function loadState(){
  const [tasks, insights, weekly] = await Promise.allSettled([
    idbGet('cd-tasks'), idbGet('cd-insights'), idbGet('cd-weekly')
  ]);
  [tasks, insights, weekly].forEach(r => {
    if(r.status === 'rejected') console.error('Failed to load stored data:', r.reason);
  });
  state.tasks = tasks.status === 'fulfilled' ? (tasks.value || []) : [];
  state.insights = insights.status === 'fulfilled' ? (insights.value || []) : [];
  state.weekly = weekly.status === 'fulfilled' ? (weekly.value || []) : [];
  renderAll();
}

async function saveTasks(){ try{ await idbSet('cd-tasks', state.tasks); return true; }catch(e){ console.error(e); return false; } }
async function saveInsights(){ try{ await idbSet('cd-insights', state.insights); }catch(e){ console.error(e); } }
async function saveWeekly(){ try{ await idbSet('cd-weekly', state.weekly); }catch(e){ console.error(e); } }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function makeTask(overrides){
  return Object.assign({
    id: uid(), text: '', type: 'text', status: null, archived: false, flagged: false,
    laneEnteredAt: null, note: '', ts: Date.now()
  }, overrides);
}

function isUrl(str){
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch { return false; }
}

function openLink(url){ window.open(url, '_blank', 'noopener'); }
function openLinkFor(id){
  const t = state.tasks.find(x => x.id === id);
  if(t) openLink(t.text);
}

function sourceMark(t){
  return t.source === 'shared' ? '<svg class="share-mark" aria-label="Shared to Command Deck"><use href="#i-scope"/></svg>' : '';
}

function renderTaskText(t){
  const mark = sourceMark(t);
  if(t.type === 'attachment'){
    return `${mark}<button type="button" class="attach-badge" onclick="viewAttachmentsFor('${t.id}')"><svg><use href="#i-attach"/></svg>${escapeHtml(attachmentLabel(t.attachments))}</button>${t.text ? `<div class="meta">${escapeHtml(t.text)}</div>` : ''}`;
  }
  const noteLine = t.note ? `<div class="meta">${escapeHtml(t.note)}</div>` : '';
  return `${mark}${escapeHtml(t.text)}${noteLine}`;
}
function taskSummaryText(t){
  return t.type === 'attachment' ? attachmentLabel(t.attachments) : t.text;
}

const MAX_ATTACHMENT_BYTES = 15 * 1024 * 1024;
const EXTENSION_MIME_TYPES = {
  '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg',
  '.gif': 'image/gif', '.webp': 'image/webp', '.pdf': 'application/pdf'
};
const ACCEPTED_ATTACHMENT_EXTENSIONS = Object.keys(EXTENSION_MIME_TYPES);
function inferMimeType(file){
  if(file.type) return file.type;
  const name = file.name.toLowerCase();
  const ext = ACCEPTED_ATTACHMENT_EXTENSIONS.find(e => name.endsWith(e));
  return ext ? EXTENSION_MIME_TYPES[ext] : file.type;
}
function isAcceptedAttachmentType(file){
  // Raster images only — image/svg+xml is excluded because it can carry an
  // embedded <script> that executes same-origin when opened as a top-level
  // document from a blob: URL (blob: inherits the creating page's origin).
  if(file.type === 'image/svg+xml') return false;
  if(file.type.startsWith('image/') || file.type === 'application/pdf') return true;
  if(!file.type){
    // Some file pickers/content providers report an empty MIME type; fall
    // back to the extension rather than reject a legitimate file outright.
    const name = file.name.toLowerCase();
    return ACCEPTED_ATTACHMENT_EXTENSIONS.some(ext => name.endsWith(ext));
  }
  return false;
}
function formatBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}
function openBlobUrl(url){
  // A same-document anchor click is more reliable than window.open() for
  // blob: URLs across browsers (notably WebKit, which can open a blank tab
  // when navigating a new browsing context directly to a blob: URL).
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function attachmentLabel(attachments){
  if(attachments.length === 1) return attachments[0].filename;
  return `${attachments[0].filename} +${attachments.length - 1} more`;
}

function flagInvalid(el){
  el.classList.add('field-error');
  el.focus();
  el.addEventListener('input', () => el.classList.remove('field-error'), { once: true });
}
function timeAgo(ts){
  const diff = Date.now() - ts;
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs/24);
  return days + 'd ago';
}

function laneAge(ts){
  if(!ts) return '';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if(days < 1) return 'today';
  if(days < 7) return days + 'd';
  return Math.floor(days/7) + 'w';
}

const VIEWS = ['capture','board','signal','pulse'];

function switchView(v){
  if(savingAttachment) return;
  closeAttachOverlay();
  closeViewOverlay();
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.toggle('active', el.dataset.view === v));
  history.replaceState(null, '', '#' + v);
}

function navTap(v){
  switchView(v);
  if(navigator.vibrate) navigator.vibrate(8);
}

function routeFromHash(){
  const v = location.hash.slice(1);
  switchView(VIEWS.includes(v) ? v : 'capture');
}
window.addEventListener('hashchange', routeFromHash);

async function addCapture(){
  const input = document.getElementById('captureInput');
  const text = input.value.trim();
  if(!text){ flagInvalid(input); return; }
  state.tasks.unshift(makeTask({ text, type: isUrl(text) ? 'link' : 'text' }));
  input.value = '';
  await saveTasks();
  renderQueue(); renderBoard(); renderStats();
}

let pendingAttachments = [];
let pendingRejections = [];
let pendingAttachSource = 'manual';

function clearPendingAttachments(){
  pendingAttachments.forEach(a => { if(a.previewUrl) URL.revokeObjectURL(a.previewUrl); });
  pendingAttachments = [];
  pendingRejections = [];
}

function queueFilesForAttach(files, source){
  clearPendingAttachments();
  pendingAttachSource = source;
  files.forEach(file => {
    if(!isAcceptedAttachmentType(file)){
      pendingRejections.push({ filename: file.name, reason: 'unsupported type' });
      return;
    }
    if(file.size > MAX_ATTACHMENT_BYTES){
      pendingRejections.push({ filename: file.name, reason: 'over 15MB' });
      return;
    }
    const mimeType = inferMimeType(file);
    pendingAttachments.push({
      id: uid(), file, mimeType,
      previewUrl: mimeType.startsWith('image/') ? URL.createObjectURL(file) : null
    });
  });
  if(pendingAttachments.length === 0 && pendingRejections.length === 0) return;
  openAttachOverlay();
}

function onAttachFilesChosen(fileList){
  queueFilesForAttach(Array.from(fileList), 'manual');
}

function openAttachOverlay(){
  renderAttachOverlay();
  document.getElementById('attachOverlay').classList.add('open');
}

function closeAttachOverlay(){
  if(savingAttachment) return;
  clearPendingAttachments();
  pendingAttachSource = 'manual';
  document.getElementById('attachOverlay').classList.remove('open');
  document.getElementById('attachNote').value = '';
  document.getElementById('attachSaveError').style.display = 'none';
  document.getElementById('captureFileInput').value = '';
}

function renderAttachOverlay(){
  const list = document.getElementById('attachOverlayList');
  list.innerHTML = pendingAttachments.map(a => `
    <div class="attach-row">
      ${a.previewUrl
        ? `<img class="attach-thumb" src="${a.previewUrl}" alt="">`
        : `<div class="attach-thumb attach-file-icon"><svg><use href="#i-file"/></svg></div>`}
      <div class="attach-meta">
        <div class="attach-name">${escapeHtml(a.file.name)}</div>
        <div class="meta mono">${formatBytes(a.file.size)}</div>
      </div>
    </div>
  `).join('') + pendingRejections.map(r => `
    <div class="attach-row">
      <div class="attach-thumb attach-file-icon"><svg><use href="#i-file"/></svg></div>
      <div class="attach-meta">
        <div class="attach-name">${escapeHtml(r.filename)}</div>
        <div class="attach-error">Skipped — ${escapeHtml(r.reason)}</div>
      </div>
    </div>
  `).join('');
}

let savingAttachment = false;
async function saveAttachCapture(){
  if(savingAttachment) return;
  const errEl = document.getElementById('attachSaveError');
  errEl.style.display = 'none';
  if(pendingAttachments.length === 0){
    errEl.textContent = 'No valid files to save — remove the unsupported ones and try again, or Cancel.';
    errEl.style.display = 'block';
    return;
  }
  savingAttachment = true;
  try {
    const note = document.getElementById('attachNote').value.trim();
    let metas;
    try {
      metas = await Promise.all(pendingAttachments.map(async (a) => {
        await idbPutAttachment(a.id, a.file);
        return { id: a.id, filename: a.file.name, mimeType: a.mimeType, size: a.file.size };
      }));
    } catch(e){
      console.error(e);
      await Promise.all(pendingAttachments.map(a => idbDeleteAttachment(a.id).catch(() => {})));
      errEl.textContent = "Couldn't save — check available storage on this device and try again.";
      errEl.style.display = 'block';
      return;
    }
    const task = makeTask({ text: note, type: 'attachment', attachments: metas, source: pendingAttachSource === 'shared' ? 'shared' : undefined });
    state.tasks.unshift(task);
    const ok = await saveTasks();
    if(!ok){
      state.tasks = state.tasks.filter(x => x.id !== task.id);
      await Promise.all(metas.map(m => idbDeleteAttachment(m.id).catch(() => {})));
      errEl.textContent = "Couldn't save — check available storage on this device and try again.";
      errEl.style.display = 'block';
      return;
    }
    // Clear the in-flight flag before closing — closeAttachOverlay() itself
    // refuses to run while a save is in flight (to protect against Cancel/nav
    // interrupting one), which would otherwise also block this, its own
    // successful completion, from closing the overlay.
    savingAttachment = false;
    closeAttachOverlay();
    renderQueue(); renderBoard(); renderStats();
  } finally {
    savingAttachment = false;
  }
}

let openAttachmentUrls = [];
let viewOverlayLoading = false;

async function viewAttachmentsFor(id){
  if(viewOverlayLoading) return;
  const t = state.tasks.find(x => x.id === id);
  if(!t || !t.attachments) return;
  viewOverlayLoading = true;
  let resolved;
  try {
    resolved = await Promise.all(t.attachments.map(async (meta) => {
      const file = await idbGetAttachment(meta.id);
      return { meta, url: file ? URL.createObjectURL(file) : null };
    }));
  } catch(e){
    console.error(e);
    viewOverlayLoading = false;
    return;
  }
  viewOverlayLoading = false;
  openAttachmentUrls = resolved.map(r => r.url).filter(Boolean);
  const list = document.getElementById('viewOverlayList');
  list.innerHTML = resolved.map(r => `
    <div class="attach-row">
      ${r.url && r.meta.mimeType.startsWith('image/')
        ? `<img class="attach-thumb" src="${r.url}" alt="">`
        : `<div class="attach-thumb attach-file-icon"><svg><use href="#i-file"/></svg></div>`}
      <div class="attach-meta">
        <div class="attach-name">${escapeHtml(r.meta.filename)}</div>
        <div class="meta mono">${formatBytes(r.meta.size)}</div>
      </div>
      ${r.url ? `<button class="mini-btn" onclick="openBlobUrl('${r.url}')">Open</button>` : ''}
    </div>
  `).join('');
  document.getElementById('viewOverlay').classList.add('open');
}

function closeViewOverlay(){
  document.getElementById('viewOverlay').classList.remove('open');
  const urls = openAttachmentUrls;
  openAttachmentUrls = [];
  setTimeout(() => urls.forEach(u => URL.revokeObjectURL(u)), 30000);
}

async function setStatus(id, status){
  const t = state.tasks.find(x => x.id === id);
  if(t){ t.status = status; t.laneEnteredAt = Date.now(); await saveTasks(); renderQueue(); renderBoard(); renderStats(); renderSomedayReview(); }
  if(navigator.vibrate) navigator.vibrate(12);
}

async function addInsight(){
  const source = document.getElementById('insightSource').value;
  const textInput = document.getElementById('insightText');
  const text = textInput.value.trim();
  const ref = document.getElementById('insightRef').value.trim();
  if(!text){ flagInvalid(textInput); return; }
  state.insights.unshift({ id: uid(), source, text, ref, ts: Date.now() });
  document.getElementById('insightText').value = '';
  document.getElementById('insightRef').value = '';
  await saveInsights();
  renderInsights(); renderStats();
}

async function addWeekly(){
  const shippedInput = document.getElementById('wkShipped');
  const stuckInput = document.getElementById('wkStuck');
  const surpriseInput = document.getElementById('wkSurprise');
  const shipped = shippedInput.value.trim();
  const stuck = stuckInput.value.trim();
  const surprise = surpriseInput.value.trim();
  if(!shipped && !stuck && !surprise){
    flagInvalid(shippedInput); flagInvalid(stuckInput); flagInvalid(surpriseInput);
    return;
  }
  const now = new Date();
  state.weekly.unshift({ id: uid(), week: now.toLocaleDateString(undefined,{month:'short',day:'numeric'}), shipped, stuck, surprise, ts: Date.now() });
  document.getElementById('wkShipped').value = '';
  document.getElementById('wkStuck').value = '';
  document.getElementById('wkSurprise').value = '';
  await saveWeekly();
  renderWeekly();
}

function renderQueue(){
  const el = document.getElementById('queueList');
  const untriaged = state.tasks.filter(t => !t.status && !t.archived);
  if(untriaged.length === 0){ el.innerHTML = '<div class="empty"><svg><use href="#i-scope"/></svg>Queue is clear. Nice.</div>'; return; }
  el.innerHTML = untriaged.map(t => `
    <div class="queue-item">
      <div style="flex:1">
        <div class="txt">${renderTaskText(t)}</div>
        <div class="meta mono">${timeAgo(t.ts)}</div>
        <div class="chip-row">
          ${LANES.filter(l => l.key !== 'done').map(l => `<div class="chip ${l.key}" onclick="setStatus('${t.id}','${l.key}')">${l.label}</div>`).join('')}
        </div>
        <div class="item-actions">
          ${t.type === 'link' ? `<button class="mini-btn" onclick="openLinkFor('${t.id}')">Open</button>` : ''}
          <button class="mini-btn danger" onclick="deleteTask('${t.id}')">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

const LANES = [
  {key:'today', label:'Today'}, {key:'week', label:'Week'},
  {key:'someday', label:'Someday'}, {key:'done', label:'Done'}
];
let boardActiveLane = 'today';

function selectLane(key){
  boardActiveLane = key;
  renderBoard();
  if(navigator.vibrate) navigator.vibrate(8);
}

function renderLanePills(){
  const el = document.getElementById('lanePills');
  el.innerHTML = LANES.map(l => `
    <button class="lane-pill ${l.key} ${l.key === boardActiveLane ? 'active' : ''}" onclick="selectLane('${l.key}')">${l.label}</button>
  `).join('');
}

function renderBoard(){
  renderLanePills();
  const el = document.getElementById('boardScroller');
  el.innerHTML = LANES.map(c => {
    const items = c.key === 'done'
      ? state.tasks.filter(t => t.archived)
      : state.tasks.filter(t => t.status === c.key && !t.archived);
    const actionsFor = (t) => c.key === 'done'
      ? `<button class="mini-btn" onclick="restoreTask('${t.id}')">Restore</button>
         <button class="mini-btn danger" onclick="deleteTask('${t.id}')">Delete</button>`
      : `${t.type === 'link' ? `<button class="mini-btn" onclick="openLinkFor('${t.id}')">Open</button>` : ''}
         <button class="mini-btn ${t.flagged ? 'active' : ''}" onclick="toggleFlag('${t.id}')">${t.flagged ? 'Unflag' : 'Now'}</button>
         ${LANES.filter(x => x.key !== c.key && x.key !== 'done').map(x => `<button class="mini-btn" onclick="setStatus('${t.id}','${x.key}')">${x.label}</button>`).join('')}
         <button class="mini-btn" onclick="archiveTask('${t.id}')">Done</button>
         <button class="mini-btn danger" onclick="deleteTask('${t.id}')">Delete</button>`;
    return `
      <div class="column ${c.key} ${c.key === boardActiveLane ? 'lane-active' : ''}">
        <div class="col-head">
          <div class="col-bar ${c.key}"></div>
          <div class="col-title">${c.label}</div>
          <div class="col-count mono">${items.length}</div>
        </div>
        <div class="col-body">
          ${items.length === 0 ? '<div class="empty">Empty</div>' : items.map(t => `
            <div class="task-card ${c.key}">
              ${t.flagged ? '<span class="flag-dot"></span>' : ''}${renderTaskText(t)}
              ${c.key === 'someday' ? `<div class="card-age mono">${laneAge(t.laneEnteredAt)} in Someday</div>` : ''}
              <div class="row-actions">
                ${actionsFor(t)}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

async function archiveTask(id){
  const t = state.tasks.find(x => x.id === id);
  if(t){ t.archived = true; t.flagged = false; await saveTasks(); renderBoard(); renderQueue(); renderStats(); renderNowStrip(); renderSomedayReview(); }
  if(navigator.vibrate) navigator.vibrate([8,20,8]);
}

async function restoreTask(id){
  const t = state.tasks.find(x => x.id === id);
  if(t){ t.archived = false; t.laneEnteredAt = Date.now(); await saveTasks(); renderBoard(); renderQueue(); renderStats(); renderSomedayReview(); }
  if(navigator.vibrate) navigator.vibrate(12);
}

async function deleteTask(id){
  const t = state.tasks.find(x => x.id === id);
  state.tasks = state.tasks.filter(x => x.id !== id);
  const ok = await saveTasks();
  if(ok && t && t.attachments){
    // Only reclaim attachment blobs once the task-list removal is actually
    // persisted — otherwise a failed save would leave the on-disk task
    // pointing at blobs we already deleted.
    await Promise.all(t.attachments.map(a => idbDeleteAttachment(a.id).catch(e => console.error(e))));
  }
  renderBoard(); renderQueue(); renderStats(); renderNowStrip(); renderSomedayReview();
  if(navigator.vibrate) navigator.vibrate([8,20,8]);
}

async function toggleFlag(id){
  const t = state.tasks.find(x => x.id === id);
  if(!t) return;
  const flagging = !t.flagged;
  state.tasks.forEach(x => { x.flagged = false; });
  if(flagging){
    t.flagged = true;
    if(t.status !== 'today'){ t.status = 'today'; t.laneEnteredAt = Date.now(); }
  }
  await saveTasks();
  renderBoard(); renderNowStrip(); renderSomedayReview();
  if(navigator.vibrate) navigator.vibrate(12);
}

function renderNowStrip(){
  const el = document.getElementById('nowStrip');
  const t = state.tasks.find(x => x.flagged && !x.archived);
  if(!t){
    el.className = 'now-strip idle';
    el.innerHTML = `<svg><use href="#i-scope"/></svg><span class="txt">Nothing flagged — pick your one thing.</span>`;
  } else {
    el.className = 'now-strip';
    let action = '';
    if(t.type === 'link') action = `<button class="mini-btn" onclick="event.stopPropagation(); openLinkFor('${t.id}')">Open</button>`;
    else if(t.type === 'attachment') action = `<button class="mini-btn" onclick="event.stopPropagation(); viewAttachmentsFor('${t.id}')">View</button>`;
    el.innerHTML = `<span class="lbl">Now</span><span class="txt">${escapeHtml(taskSummaryText(t))}</span>${action}`;
  }
}

function renderInsights(){
  const el = document.getElementById('insightList');
  if(state.insights.length === 0){ el.innerHTML = '<div class="empty"><svg><use href="#i-signal"/></svg>No signals logged yet.</div>'; return; }
  el.innerHTML = state.insights.slice(0,50).map(i => `
    <div class="insight-card">
      <div class="src-tag">${escapeHtml(i.source)} · ${timeAgo(i.ts)}</div>
      <p>${escapeHtml(i.text)}</p>
      ${i.ref ? `<div class="ref mono">${escapeHtml(i.ref)}</div>` : ''}
      <div class="item-actions">
        <button class="mini-btn danger" onclick="deleteInsight('${i.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

async function deleteInsight(id){
  state.insights = state.insights.filter(i => i.id !== id);
  await saveInsights();
  renderInsights(); renderStats();
  if(navigator.vibrate) navigator.vibrate([8,20,8]);
}

function renderWeekly(){
  const el = document.getElementById('weeklyList');
  el.innerHTML = state.weekly.slice(0,10).map(w => `
    <div class="log-entry">
      <div class="wk mono">${w.week}</div>
      ${w.shipped ? `<div class="field"><b>Shipped:</b> ${escapeHtml(w.shipped)}</div>` : ''}
      ${w.stuck ? `<div class="field"><b>Stuck:</b> ${escapeHtml(w.stuck)}</div>` : ''}
      ${w.surprise ? `<div class="field"><b>Surprised:</b> ${escapeHtml(w.surprise)}</div>` : ''}
      <div class="item-actions">
        <button class="mini-btn danger" onclick="deleteWeekly('${w.id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

async function deleteWeekly(id){
  state.weekly = state.weekly.filter(w => w.id !== id);
  await saveWeekly();
  renderWeekly();
  if(navigator.vibrate) navigator.vibrate([8,20,8]);
}

function renderStats(){
  const el = document.getElementById('statGrid');
  const today = state.tasks.filter(t=>t.status==='today' && !t.archived).length;
  const week = state.tasks.filter(t=>t.status==='week' && !t.archived).length;
  const someday = state.tasks.filter(t=>t.status==='someday' && !t.archived).length;
  const weekAgo = Date.now() - 7*24*60*60*1000;
  const signals = state.insights.filter(i => i.ts > weekAgo).length;
  const stats = [
    {n: today, l:'Today'}, {n: week, l:'This week'},
    {n: someday, l:'Someday'}, {n: signals, l:'Signals this week'}
  ];
  el.innerHTML = stats.map(s => `
    <div class="stat-card">
      <svg class="sweep"><use href="#i-scope"/></svg>
      <div class="stat-num">${s.n}</div>
      <div class="stat-label">${s.l}</div>
    </div>
  `).join('');
}

function renderSomedayReview(){
  const el = document.getElementById('somedayReview');
  const items = state.tasks.filter(t => t.status === 'someday' && !t.archived);
  if(items.length === 0){ el.innerHTML = '<div class="empty">Nothing parked in Someday. Nice.</div>'; return; }
  el.innerHTML = items.map(t => `
    <div class="review-item">
      <div class="txt">${renderTaskText(t)}</div>
      <div class="meta mono">${laneAge(t.laneEnteredAt)} in Someday</div>
      <div class="review-actions">
        ${t.type === 'link' ? `<button class="mini-btn" onclick="openLinkFor('${t.id}')">Open</button>` : ''}
        <button class="mini-btn" onclick="setStatus('${t.id}','today')">→ Today</button>
        <button class="mini-btn" onclick="setStatus('${t.id}','week')">→ Week</button>
        <button class="mini-btn" onclick="archiveTask('${t.id}')">Kill (Done)</button>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderAll(){
  renderQueue(); renderBoard(); renderInsights(); renderWeekly(); renderStats(); renderNowStrip(); renderSomedayReview();
}

function tickClock(){
  const el = document.getElementById('clock');
  const d = new Date();
  el.textContent = d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
}
tickClock();
setInterval(tickClock, 30000);

const SHARE_CACHE_NAME = 'command-deck-share';

async function readStagedShare(){
  if(!('caches' in window)) return null;
  const cache = await caches.open(SHARE_CACHE_NAME);
  const metaResp = await cache.match('meta');
  if(!metaResp) return null;
  const meta = await metaResp.json();
  const fileIndexes = Array.from({ length: meta.fileCount }, (_, i) => i);
  const files = (await Promise.all(fileIndexes.map(async (i) => {
    const resp = await cache.match(`file-${i}`);
    if(!resp) return null;
    const blob = await resp.blob();
    const filename = decodeURIComponent(resp.headers.get('X-Filename') || `file-${i}`);
    return new File([blob], filename, { type: resp.headers.get('Content-Type') || blob.type });
  }))).filter(Boolean);
  // Wipe the whole staging cache, not just the keys this share's meta knows
  // about — its sole purpose is this transient handoff, so a share that
  // overwrote an earlier, never-processed one shouldn't leave that one's
  // files orphaned here forever.
  const allKeys = await cache.keys();
  await Promise.all(allKeys.map(req => cache.delete(req)));
  return {
    title: (meta.title || '').trim(),
    text: (meta.text || '').trim(),
    url: (meta.url || '').trim(),
    files
  };
}

async function handleIncomingShare(){
  const params = new URLSearchParams(location.search);
  if(!params.has('shared')) return;
  history.replaceState(null, '', location.pathname + '#capture');
  switchView('capture');

  let staged;
  try {
    staged = await readStagedShare();
  } catch(e){
    console.error('Failed to read staged share', e);
    return;
  }
  if(!staged) return;
  const { title, text, url, files } = staged;

  // Prefer the URL as the primary (actionable) content so link detection and
  // the Open action keep working — but a share can carry separate descriptive
  // text alongside it (e.g. sharing a page sends both), so keep that too
  // rather than silently dropping it.
  const raw = url || text || title;
  const extra = [url, text, title]
    .filter(v => v && v !== raw)
    .filter((v, i, arr) => arr.indexOf(v) === i)
    .join(' — ');

  if(files.length > 0){
    queueFilesForAttach(files, 'shared');
    if(pendingAttachments.length > 0){
      const prefill = [url, text, title].filter((v, i, arr) => v && arr.indexOf(v) === i).join(' — ');
      if(prefill) document.getElementById('attachNote').value = prefill;
      return;
    }
    if(!raw){
      // Every shared file was rejected and there's nothing to fall back to —
      // leave the overlay open showing why (already rendered by
      // queueFilesForAttach) instead of silently discarding the share.
      return;
    }
    // There's accompanying text/url to fall back to — don't strand the user
    // on a dead-end "nothing to save" overlay.
    closeAttachOverlay();
  }

  if(raw){
    state.tasks.unshift(makeTask({ text: raw, type: isUrl(raw) ? 'link' : 'text', source: 'shared', note: extra }));
    await saveTasks();
    renderQueue(); renderBoard(); renderStats();
  }
}

routeFromHash();
loadState().then(handleIncomingShare);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW registration failed', e));
  });
}
</script>
