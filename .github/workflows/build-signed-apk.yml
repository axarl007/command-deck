name: Build signed APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name for this build (e.g. 1.0) — letters, digits, dots, dashes, underscores only'
        required: true
        default: '1.0'
      createRelease:
        description: 'Attach the APK to a new GitHub Release (only happens if signing is actually configured)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # versionName ends up spliced into a Groovy source file (build.gradle) and used as a git
      # tag name, not just shell text — restricting its charset upfront is far more robust than
      # trying to escape it correctly for three different consumers afterward.
      - name: Validate version name
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::versionName '$VERSION_NAME' must match ^[A-Za-z0-9][A-Za-z0-9._-]*\$ (letters, digits, dots, dashes, underscores)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Routed through env vars rather than ${{ secrets.* }} string-interpolated straight into a
      # shell test, to avoid splicing secret content into script text.
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # versionCode must strictly increase for `adb install -r` to update in place — the GH run
      # number is monotonic across this workflow's history, so it's a safe source for it.
      - name: Set app version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          sed -i "s#versionCode [0-9]*#versionCode ${{ github.run_number }}#" app/build.gradle
          sed -i "s#versionName \"[^\"]*\"#versionName \"$VERSION_NAME\"#" app/build.gradle

      - name: Decode signing key
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && 'android.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove decoded key
        if: always()
        run: rm -f android.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release${{ steps.signing.outputs.signed == 'true' && '' || '-unsigned' }}
          path: native/app/build/outputs/apk/release/app-release.apk

      # Only publishes when the build was actually signed — an unsigned APK published as a
      # "Release" with adb-update-in-place instructions would be actively misleading (it can't
      # update in place over a prior signed install), so this stays skipped rather than adjusting
      # the wording; the job summary step below explains why when that happens.
      - name: Create GitHub Release
        if: ${{ inputs.createRelease && steps.signing.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.versionName }}
          name: v${{ inputs.versionName }}
          body: |
            Signed release APK, built and signed in CI.

            Install: `adb install -r app-release.apk`, or download and open on-device
            (allow "install unknown apps" if prompted). Updates in place over any prior
            release-signed install.
          files: native/app/build/outputs/apk/release/app-release.apk

      - name: Note unsigned build
        if: ${{ inputs.createRelease && steps.signing.outputs.signed != 'true' }}
        run: |
          echo "### No Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing secrets (ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_PASSWORD) aren't fully set, so this build produced an **unsigned** APK — uploaded as the \`app-release-unsigned\` artifact above, but not published as a Release. See native/README.md step 4B for how to set the three repo secrets." >> "$GITHUB_STEP_SUMMARY"
