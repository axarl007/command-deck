name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No build step — index.html is the whole app, inline CSS/JS, no bundler.
      # This just stages the static files that are actually meant to be public
      # (skipping dev tooling: node_modules, scripts/, native/, .claude/, package*.json).
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp icon-*.png shortcut-*.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
